<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Administrador</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body class="login-page">

<div class="auth-card">

<div class="auth-left">

<div class="shape shape-1"></div>
<div class="shape shape-2"></div>

<div class="auth-tabs">

<button onclick="window.location.href='login-funcionario.html'">
Funcionário
</button>

<button class="active">
Empresa
</button>

</div>

</div>


<div class="auth-right">

<h1>
Área do Administrador
</h1>

<p>
Entre com suas credenciais ou crie uma nova empresa.
</p>


<label>E-mail</label>

<input type="email" id="email">


<label>Senha</label>

<input type="password" id="senha">


<button
  class="auth-btn"
  onclick="loginEmpresa()">

  Entrar

</button>


<div class="login-links">

<a href="cadastro-empresa.html">

Ainda não tem conta?
Cadastre sua empresa

</a>

<a href="#">

Esqueci a senha

</a>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

async function loginEmpresa() {

  const email = document
    .getElementById('email')
    .value

  const senha = document
    .getElementById('senha')
    .value



  const { data, error } = await banco
    .from('empresas')
    .select('*')
    .ilike('email', email)
    .eq('senha', senha)



  console.log(data)
  console.log(error)



  if (error) {

    alert(error.message)

    return
  }



  if (!data || data.length === 0) {

    alert('E-mail ou senha inválidos')

    return
  }



  localStorage.setItem(
    'empresa',
    JSON.stringify(data[0])
  )



  /* ADICIONADO: identifica o usuário admin desta empresa
     para o sistema de controle de acesso */

  const { data: usuarioAdmin } = await banco
    .from('usuarios')
    .select('*')
    .eq('empresa_id', data[0].id)
    .eq('tipo', 'admin')
    .limit(1)

  if (usuarioAdmin && usuarioAdmin.length > 0) {

    localStorage.setItem(
      'usuario',
      JSON.stringify(usuarioAdmin[0])
    )
  }



  alert('Login realizado com sucesso!')



  window.location.href = 'index-novo.html'
}

</script>

</script>

</script>

</body>

</html>
