<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Cadastro Empresa
</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="style.css">

</head>

<body class="login-page">

<div class="auth-card">

<div class="auth-left">

<div class="shape shape-1"></div>

<div class="shape shape-2"></div>

<div class="auth-tabs">

<button
onclick="window.location.href='login-funcionario.html'">

Funcionário

</button>

<button class="active">

Empresa

</button>

</div>

</div>



<div class="auth-right cadastro">

<h1>

Área do Administrador

</h1>

<p>

Entre com suas credenciais ou crie uma nova empresa.

</p>


<label>
Nome da Empresa
</label>

<input
type="text"
placeholder="Empresa LTDA"
>


<label>
CNPJ
</label>

<input
type="text"
placeholder="00.000.000/0000-00"
>


<label>
Seu Nome
</label>

<input
type="text"
placeholder="João da Silva"
>


<label>
E-mail
</label>

<input
type="email"
placeholder="admin@empresa.com"
>


<label>
Senha
</label>

<input
type="password"
placeholder="Mínimo 6 caracteres"
>


<button class="auth-btn"
onclick="window.location.href='login.html'">

Cadastrar Empresa

</button>


<div class="login-links">

<a href="login.html">

Já tem conta?
Faça login

</a>

</div>

</div>

</div>

</body>

</html>
