<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Login Funcionário
</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body class="login-page">

<div class="auth-card">

<div class="auth-left">

<div class="shape shape-1"></div>

<div class="shape shape-2"></div>

<div class="auth-tabs">

<button class="active">

Funcionário

</button>

<button
onclick="window.location.href='login.html'">

Empresa

</button>

</div>

</div>



<div class="auth-right">

<h1>

Acesso Funcional

</h1>

<p>

Utilize o código da empresa fornecida pelo administrador.

</p>


<label>

Código da Empresa

</label>

<input
type="text"
maxlength="6"
placeholder="______"
>


<small>

Código de 6 dígitos fornecidos pelo administrador

</small>


<label>

Nome

</label>

<input
type="text"
placeholder="Seu nome completo"
>


<label>

E-mail

</label>

<input
type="email"
placeholder="admin@empresa.com"
>


<button class="auth-btn"
onclick="window.location.href='index-novo.html'">

Entrar

</button>

</div>

</div>

</body>

</html>
