<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Login Funcionário
</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body class="login-page">

<div class="auth-card">

<div class="auth-left">

<div class="shape shape-1"></div>

<div class="shape shape-2"></div>

<div class="auth-tabs">

<button class="active">

Funcionário

</button>

<button
onclick="window.location.href='login.html'">

Empresa

</button>

</div>

</div>



<div class="auth-right">

<h1>

Acesso Funcional

</h1>

<p>

Utilize o código da empresa fornecida pelo administrador.

</p>


<label>

Código da Empresa

</label>

<input
type="text"
id="codigoEmpresa"
maxlength="6"
placeholder="______"
>


<small>

Código de 6 dígitos fornecidos pelo administrador

</small>


<label>

Nome

</label>

<input
type="text"
id="nomeFuncionario"
placeholder="Seu nome completo"
>


<label>

E-mail

</label>

<input
type="email"
id="emailFuncionario"
placeholder="admin@empresa.com"
>


<button class="auth-btn"
onclick="loginFuncionario()">

Entrar

</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script>

/* ADICIONADO: login real do funcionário, usando a estrutura
   já existente (empresas.codigo + usuarios.email + usuarios.tipo) */

async function loginFuncionario() {

  const codigo =
    document.getElementById('codigoEmpresa').value.trim()

  const nome =
    document.getElementById('nomeFuncionario').value.trim()

  const email =
    document.getElementById('emailFuncionario').value.trim()

  if (!codigo || !email) {

    alert('Informe o código da empresa e o e-mail.')

    return
  }

  const { data: empresas, error: erroEmpresa } = await banco
    .from('empresas')
    .select('*')
    .eq('codigo', codigo)

  if (erroEmpresa) {

    alert(erroEmpresa.message)

    return
  }

  if (!empresas || empresas.length === 0) {

    alert('Código de empresa inválido.')

    return
  }

  const empresa = empresas[0]

  const { data: usuarios, error: erroUsuario } = await banco
    .from('usuarios')
    .select('*')
    .eq('empresa_id', empresa.id)
    .eq('tipo', 'funcionario')
    .eq('ativo', true)
    .ilike('email', email)

  if (erroUsuario) {

    alert(erroUsuario.message)

    return
  }

  if (!usuarios || usuarios.length === 0) {

    alert('Funcionário não encontrado ou inativo para essa empresa. Peça ao administrador para realizar o cadastro.')

    return
  }

  localStorage.setItem(
    'empresa',
    JSON.stringify(empresa)
  )

  localStorage.setItem(
    'usuario',
    JSON.stringify(usuarios[0])
  )

  window.location.href = 'index-novo.html'
}

</script>

</body>

</html>
